<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">LARA system architecture</title>
  <desc id="desc">Flow diagram from browser voice input through the React client, Express API, Groq, and browser speech synthesis.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#1b1b1b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern></defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/><rect width="1200" height="620" rx="26" fill="url(#grid)"/>
  <text x="70" y="72" fill="#fff" font-family="Arial" font-size="28" font-weight="700">LARA / REQUEST FLOW</text><text x="70" y="100" fill="#888" font-family="Arial" font-size="13">Browser speech APIs + React + Express + Groq</text>
  <g font-family="Arial">
    <rect x="70" y="180" width="190" height="150" rx="16" fill="#171717" stroke="#fff" stroke-opacity=".35"/><text x="96" y="220" fill="#888" font-size="11" font-weight="700" letter-spacing="2">BROWSER</text><text x="96" y="258" fill="#fff" font-size="19" font-weight="700">Voice + text</text><text x="96" y="286" fill="#aaa" font-size="12">SpeechRecognition</text><text x="96" y="306" fill="#aaa" font-size="12">SpeechSynthesis</text>
    <rect x="350" y="180" width="220" height="150" rx="16" fill="#171717" stroke="#fff" stroke-opacity=".35"/><text x="376" y="220" fill="#888" font-size="11" font-weight="700" letter-spacing="2">CLIENT</text><text x="376" y="258" fill="#fff" font-size="19" font-weight="700">React + Vite</text><text x="376" y="286" fill="#aaa" font-size="12">Debate context</text><text x="376" y="306" fill="#aaa" font-size="12">Conversation UI</text>
    <rect x="660" y="180" width="220" height="150" rx="16" fill="#171717" stroke="#fff" stroke-opacity=".35"/><text x="686" y="220" fill="#888" font-size="11" font-weight="700" letter-spacing="2">SERVER</text><text x="686" y="258" fill="#fff" font-size="19" font-weight="700">Express API</text><text x="686" y="286" fill="#aaa" font-size="12">POST /api/debate</text><text x="686" y="306" fill="#aaa" font-size="12">Validation + orchestration</text>
    <rect x="970" y="180" width="160" height="150" rx="16" fill="#fff"/><text x="996" y="220" fill="#555" font-size="11" font-weight="700" letter-spacing="2">MODEL</text><text x="996" y="258" fill="#000" font-size="19" font-weight="700">Groq</text><text x="996" y="286" fill="#333" font-size="12">gpt-oss-20b</text><text x="996" y="306" fill="#333" font-size="12">Debate response</text>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M260 255h90"/><path d="M570 255h90"/><path d="M880 255h90"/><path d="M1080 330v120H150V330"/></g><g fill="#fff"><path d="m342 248 14 7-14 7z"/><path d="m652 248 14 7-14 7z"/><path d="m962 248 14 7-14 7z"/><path d="m157 443-7 14-7-14z"/></g><text x="510" y="426" fill="#aaa" font-family="Arial" font-size="13">AI response returns to the conversation, then is read aloud in the browser</text>
</svg>
