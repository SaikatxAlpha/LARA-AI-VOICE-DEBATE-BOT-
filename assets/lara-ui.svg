<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LARA AI Voice Debate Bot interface</title>
  <desc id="desc">A dark monochrome interface showing a live debate workspace, voice panel, and conversation cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#1b1b1b"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="820" rx="28" fill="url(#grid)"/>
  <rect x="28" y="28" width="1384" height="72" rx="16" fill="#111" stroke="#fff" stroke-opacity=".25"/>
  <rect x="52" y="47" width="36" height="36" rx="10" fill="#fff"/><text x="64" y="72" font-family="Arial" font-size="20" font-weight="700">L</text>
  <text x="104" y="64" fill="#fff" font-family="Arial" font-size="20" font-weight="700">LARA</text><text x="104" y="82" fill="#777" font-family="Arial" font-size="10" letter-spacing="2">AI VOICE DEBATE</text>
  <rect x="1286" y="50" width="92" height="30" rx="15" fill="#1e1e1e" stroke="#fff" stroke-opacity=".3"/><circle cx="1304" cy="65" r="5" fill="#fff"/><text x="1317" y="69" fill="#fff" font-family="Arial" font-size="11">LIVE</text>
  <rect x="28" y="124" width="270" height="668" rx="18" fill="#101010" stroke="#fff" stroke-opacity=".25"/>
  <text x="52" y="162" fill="#777" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">SESSION</text>
  <rect x="52" y="180" width="222" height="68" rx="14" fill="#1a1a1a" stroke="#fff" stroke-opacity=".2"/><rect x="68" y="198" width="32" height="32" rx="9" fill="#fff"/><circle cx="84" cy="214" r="6" fill="#000"/><text x="114" y="210" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Live Debate</text><text x="114" y="229" fill="#999" font-family="Arial" font-size="11">3 rounds</text>
  <text x="52" y="292" fill="#777" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">LARA VOICE</text>
  <rect x="52" y="310" width="222" height="60" rx="12" fill="#171717" stroke="#fff" stroke-opacity=".3"/><circle cx="76" cy="340" r="13" fill="#fff"/><text x="98" y="337" fill="#fff" font-family="Arial" font-size="12" font-weight="700">Microsoft Zira</text><text x="98" y="353" fill="#888" font-family="Arial" font-size="10">English (United States)</text><text x="253" y="344" fill="#aaa" font-family="Arial" font-size="18">⌄</text>
  <text x="52" y="414" fill="#777" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">CONTROLS</text>
  <rect x="52" y="432" width="222" height="44" rx="10" fill="#1a1a1a" stroke="#fff" stroke-opacity=".2"/><text x="70" y="459" fill="#fff" font-family="Arial" font-size="12">▶  REPLAY LARA</text><rect x="52" y="486" width="222" height="44" rx="10" fill="#1a1a1a" stroke="#fff" stroke-opacity=".2"/><text x="70" y="513" fill="#fff" font-family="Arial" font-size="12">↻  NEW DEBATE</text>
  <circle cx="80" cy="710" r="20" fill="#fff"/><text x="74" y="717" fill="#000" font-family="Arial" font-size="15" font-weight="700">L</text><text x="114" y="708" fill="#fff" font-family="Arial" font-size="12" font-weight="700">LARA AI</text><text x="114" y="725" fill="#888" font-family="Arial" font-size="11">Listening...</text>
  <text x="346" y="164" fill="#888" font-family="Arial" font-size="11" font-weight="700" letter-spacing="2">NO CAP, JUST FACTS · YOU VS. LARA</text><text x="346" y="238" fill="#fff" font-family="Arial" font-size="76" font-weight="900">SAY IT.</text><text x="346" y="310" fill="#fff" font-family="Arial" font-size="76" font-weight="900">DEFEND IT.</text><text x="350" y="350" fill="#999" font-family="Arial" font-size="16">Drop a topic, make your case, and get challenged in real time.</text>
  <rect x="346" y="386" width="1040" height="82" rx="14" fill="#101010" stroke="#fff" stroke-opacity=".22"/><text x="370" y="415" fill="#777" font-family="Arial" font-size="10" font-weight="700" letter-spacing="2">DEBATE TOPIC</text><text x="370" y="447" fill="#fff" font-family="Arial" font-size="17">Should social media platforms be responsible for misinformation?</text>
  <rect x="346" y="492" width="730" height="124" rx="14" fill="#fff"/><circle cx="374" cy="522" r="15" fill="#000"/><text x="367" y="526" fill="#fff" font-family="Arial" font-size="9" font-weight="700">YOU</text><text x="402" y="526" fill="#555" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">YOUR ARGUMENT</text><text x="370" y="564" fill="#111" font-family="Arial" font-size="15">Platforms should be accountable because their algorithms shape</text><text x="370" y="588" fill="#111" font-family="Arial" font-size="15">what millions of people see every day.</text>
  <rect x="346" y="638" width="840" height="126" rx="14" fill="#111" stroke="#fff" stroke-opacity=".3"/><circle cx="374" cy="668" r="15" fill="#fff"/><text x="369" y="673" fill="#000" font-family="Arial" font-size="12" font-weight="700">L</text><text x="402" y="672" fill="#999" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">LARA</text><text x="370" y="712" fill="#fff" font-family="Arial" font-size="15">Accountability matters, but where should responsibility end</text><text x="370" y="736" fill="#fff" font-family="Arial" font-size="15">and individual judgment begin?</text>
  <rect x="1210" y="638" width="176" height="60" rx="10" fill="#fff"/><text x="1235" y="674" fill="#000" font-family="Arial" font-size="12" font-weight="700">DEBATE  →</text>
</svg>
